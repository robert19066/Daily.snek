[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dailydotsnek"
version = "1.3.0"
description = "Python SDK for Daily.dev api"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[tool.hatch.build.targets.sdist]
include = [
  "README.md",
  "pyproject.toml",
  "src/**",
  "media/**",
  "docs/**",
  "mkdocs.yml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/snek"]